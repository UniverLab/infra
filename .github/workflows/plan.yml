name: Plan

# Trunk-based: every change reaches main through a short-lived branch and a PR.
# The PR runs fmt, init, validate and plan for each stack it touches; a change
# under shared/ plans every stack. Nothing is applied here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stacks:
    name: Changed stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          all=$(ls stacks)
          if echo "$changed" | grep -qE '^(shared/|\.github/)'; then
            picked=$all
          else
            picked=$(echo "$changed" | sed -n 's|^stacks/\([^/]*\)/.*|\1|p' | sort -u)
          fi
          echo "stacks=$(printf '%s\n' $picked | jq -R . | jq -cs 'map(select(length>0))')" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan ${{ matrix.stack }}
    needs: stacks
    if: needs.stacks.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJson(needs.stacks.outputs.stacks) }}
    defaults:
      run:
        working-directory: stacks/${{ matrix.stack }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      TF_VAR_cf_analytics_token: ${{ secrets.CF_ANALYTICS_TOKEN }}
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive
      - name: init
        run: terraform init -input=false -backend-config="endpoints={s3=\"${{ vars.R2_ENDPOINT }}\"}"
      - name: validate
        run: terraform validate -no-color
      - name: plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock=false 2>&1 | tee plan.txt
      - name: Comment the plan
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v7
        env:
          STACK: ${{ matrix.stack }}
        with:
          script: |
            const fs = require('fs');
            const path = `stacks/${process.env.STACK}/plan.txt`;
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'plan did not run';
            const summary = (text.match(/^(Plan:.*|No changes\..*)$/m) || ['see log'])[0];
            const body = `### \`${process.env.STACK}\`: ${summary}\n<details><summary>plan</summary>\n\n\`\`\`\n${text.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
